invert_scrolling = true

[theme]
theme = "ctp-mocha"
[icons]
icons = "material-nf"

[[block]]
block = "scratchpad"
[block.theme_overrides]
idle_bg = "#fab387"
idle_fg = "#1e1e2e"


[[block]]
block = "focused_window"
[block.format]
full = " $title.str(max_w:15) |"
short = " $title.str(max_w:10) |"
[block.theme_overrides]
idle_bg = "#f9e2af"
idle_fg = "#1e1e2e"

[[block]]
block = "music"
format = " $icon {$combo.str(max_w:20,rot_interval:0.5) $play $next |} "
[[block.click]]
button = "left"
action = "play_pause"
[[block.click]]
button = "middle"
widget = "."
action = "toggle_format"

[[block]]
block = "bluetooth"
mac = "E4:61:F4:F4:A1:F7"
format = " 󰂯 JBL Tune "
disconnected_format = " 󰂲 JBL Tune "
[[block.click]]
button = "left"
action = "blueman-manager"

[[block]]
block = "bluetooth"
mac = "1C:57:85:33:54:7F"
format = " 󰂯 EDENWOOD "
disconnected_format = " 󰂲 EDENWOOD "
[[block.click]]
button = "left"
action = "blueman-manager"

[[block]]
block = "net"
device = "wlp1s0"
format = " $icon {$signal_strength $ssid} "
[block.theme_overrides]
idle_bg = "#a6e3a1"
idle_fg = "#1e1e2e"

[[block]]
block = "sound"
step_width = 3
max_vol = 100
[block.theme_overrides]
idle_bg = "#94e2d5"
idle_fg = "#1e1e2e"

[[block]]
block = "backlight"
device = "amdgpu_bl1"
invert_icons = true
minimum = 10
[block.theme_overrides]
idle_bg = "#89dceb"
idle_fg = "#1e1e2e"

[[block]]
block = "battery"
format = " $icon $percentage "
[block.theme_overrides]
idle_bg = "#a6e3a1"
warning_bg = "#f9e2af"
critical_bg = "#f38ba8"

idle_fg = "#1e1e2e"
warning_fg = "#1e1e2e"
critical_fg = "#1e1e2e"

[[block]]
block = "custom"
command = "~/.local/bin/tlp-profile.sh"
interval = 5
[block.theme_overrides]
idle_bg = "#74c7ec"
idle_fg = "#1e1e2e"

[[block]]
block = "packages"
package_manager = ["pacman", "aur"]
interval = 600
error_interval = 300
max_retries = 5
format = " $icon $total updates "
format_singular = " $icon $total update "
format_up_to_date = " $icon Up to date "
# aur_command should output available updates to stdout (ie behave as echo -ne "update\n")
aur_command = "yay -Qua"

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%d/%m %H:%M') "
[block.theme_overrides]
idle_bg = "#b4befe"
idle_fg = "#1e1e2e"

[[block]]
block = "menu"
text = " \uf011  "
[[block.items]]
display = " ->  Sleep  <-"
cmd = "systemctl suspend"
[[block.items]]
display = " ->  Logout  <-"
cmd = "swaymsg exit"
[[block.items]]
display = " -> Power Off <-"
cmd = "poweroff"
confirm_msg = "Are you sure you want to power off?"
[[block.items]]
display = " ->  Reboot  <-"
cmd = "reboot"
confirm_msg = "Are you sure you want to reboot?"
