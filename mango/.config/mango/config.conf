##############################
#                            #
#        Mango Config        #
#                            #
##############################

# More option see https://github.com/DreamMaoMao/mango/wiki/

# Sources
source=~/.config/mango/rules.conf
source=~/.config/mango/style.conf
source=~/.config/mango/bind_apps.conf
source=~/.config/mango/bind_navigation.conf
source=~/.config/mango/bind_sys.conf
source=~/.config/mango/gestures.conf
source=~/.config/mango/layout_settings.conf
source=~/.config/mango/input.conf
source=~/.config/mango/output.conf
source=~/.config/mango/autostart.conf

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

