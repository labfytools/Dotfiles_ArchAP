# WHY: compositor temporaire du compte greeter, isolé de /etc/sway/config.d/*.
# CONTRACT: la session authentifiée est démarrée par greetd via UWSM, jamais par ce compositor.
output * bg /etc/greetd/background/sway.png fill
output eDP-1 mode 3200x2000@60Hz scale 1.4
input type:keyboard {
    xkb_layout fr
    xkb_variant oss
    xkb_numlock enabled
}
input type:touchpad {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
}
default_border none
# Le lanceur ferme ce Sway lorsque GTK termine après start_session.
exec /usr/local/libexec/labfy-greeter/run-ui
