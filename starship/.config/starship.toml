format = '[$symbol$branch]($style) '
style = "bold blue"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "peach"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_commit]
tag_symbol = '  '

[golang]
symbol = " "

[gradle]
