# WHY: Presence of VIRTUAL_ENV is enough; the previous custom module spawned a shell.
# CONTRACT: Retain the visible VENV-ACTIVE marker without external execution.
[env_var.VIRTUAL_ENV]
format = '[VENV-ACTIVE](mauve) '

[cmd_duration]
min_time = 2_000
format = '[󰔟 $duration](subtext0) '

