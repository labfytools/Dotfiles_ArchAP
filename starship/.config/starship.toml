#"$schema" = 'https://starship.rs/config-schema.json'
# WHY: /tmp can contain thousands of entries; the 30 ms default intermittently
# aborts project detection before the prompt's language modules are resolved.
# CONTRACT: This is a scan ceiling, not a delay or an external-command timeout.
# INVARIANT: Scanning stays bounded; this setting does not run a command.
scan_timeout = 75
# WHY: Keep identity and location stable while showing project context only when present.
# CONTRACT: The final line is always the input character; contextual modules share one compact line.
# INVARIANT: No decorative subprocess or unconditional clock is needed for this layout.
format = "$os$username$hostname$directory\n($git_branch$git_status$python$lua$rust$php$nodejs${env_var.VIRTUAL_ENV}$cmd_duration\n)$character"
right_format = "$battery"
add_newline = false

palette = "catppuccin_mocha"

[[battery.display]]
threshold = 30
style = 'bold red'

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[container]
format = '[$symbol \[$name\]]($style) '

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[directory]
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = '…/'
style = "bold lavender"
format = '[$path]($style)[$read_only]($read_only_style)'

[docker_context]
symbol = " "

[env_var.SHELL]
variable = 'SHELL'
default = 'unknown shell'

[env_var.USER]
default = 'unknown user'

[elixir]
